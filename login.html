<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل دخول الموظفين</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<div class="login-container">
    <div class="login-box">

        <img src="assets/almohia-logo.png" class="login-logo" alt="Fayz Almohia">

        <h2>تسجيل دخول الموظفين</h2>

        <form action="employee-dashboard.html" method="POST">
            <input type="text" placeholder="اسم المستخدم" required>
            <input type="password" placeholder="كلمة المرور" required>
            <button type="submit">دخول</button>
        </form>

        <p class="login-note">هذا النظام مخصص لموظفي شركة فايز المحيا للتجارة فقط</p>
    </div>
</div>

</body>
</html>
